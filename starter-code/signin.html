<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Masuk – CelikSense AI</title>
<link rel="stylesheet" href="styles.css">
<style>
body { background: linear-gradient(160deg,#c4b8ff 0%,#ddd6ff 40%,#7dd3ea 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; }
.auth-card { background:#fff; border-radius:24px; padding:40px 36px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(99,102,241,0.18); }
.auth-logo { text-align:center; margin-bottom:28px; }
.auth-logo .logo-icon { font-size:48px; line-height:1; }
.auth-logo h1 { font-size:22px; font-weight:900; color:#1e1b4b; margin:8px 0 2px; }
.auth-logo p { font-size:13px; color:#64748b; }
.form-group { margin-bottom:18px; }
.form-group label { display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:6px; }
.form-group input { width:100%; padding:12px 14px; border:1.5px solid #e2e8f0; border-radius:12px; font-size:15px; outline:none; transition:border-color 0.2s; box-sizing:border-box; }
.form-group input:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,0.12); }
.btn-primary { width:100%; padding:14px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; transition:opacity 0.2s; }
.btn-primary:hover { opacity:0.9; }
.btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
.auth-links { text-align:center; margin-top:20px; font-size:13px; color:#64748b; }
.auth-links a { color:#6366f1; font-weight:600; text-decoration:none; }
.auth-links a:hover { text-decoration:underline; }
.divider { border:none; border-top:1px solid #f1f5f9; margin:20px 0; }
.error-msg { background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:10px 14px; font-size:13px; color:#dc2626; margin-bottom:16px; display:none; }
.success-msg { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:10px 14px; font-size:13px; color:#16a34a; margin-bottom:16px; display:none; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-icon">📚</div>
    <h1>CelikSense AI</h1>
    <p>Log masuk ke akaun anda</p>
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <form id="signinForm" onsubmit="handleSignIn(event)">
    <div class="form-group">
      <label for="email">Emel</label>
      <input type="email" id="email" placeholder="nama@emel.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Kata Laluan</label>
      <input type="password" id="password" placeholder="Masukkan kata laluan" required autocomplete="current-password">
    </div>
    <div style="text-align:right;margin-bottom:20px;">
      <a href="forgot-password.html" style="font-size:13px;color:#6366f1;font-weight:600;text-decoration:none;">Lupa kata laluan?</a>
    </div>
    <button type="submit" class="btn-primary" id="submitBtn">Log Masuk</button>
  </form>

  <hr class="divider">
  <div class="auth-links">
    Belum ada akaun? <a href="signup.html">Daftar sekarang</a>
  </div>
  <div class="auth-links" style="margin-top:10px;">
    <a href="index.html">← Kembali ke Laman Utama</a>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA3yXQ06-FtBXIJ6oMFDDUjP6Z6-qeEKEU",
    authDomain: "prestij-zaharah-celiksense.firebaseapp.com",
    projectId: "prestij-zaharah-celiksense",
    storageBucket: "prestij-zaharah-celiksense.firebasestorage.app",
    messagingSenderId: "116242246073",
    appId: "1:116242246073:web:e40d0d20f4c6b733b0ae68",
    measurementId: "G-V54MJ8HBVJ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Check if already logged in
  auth.onAuthStateChanged(user => {
    if (user) {
      window.location.href = 'dashboard.html';
    }
  });

  window.handleSignIn = async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Sedang log masuk...';

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      // Save user info to localStorage
      localStorage.setItem('cs_user', JSON.stringify({
        uid: cred.user.uid,
        email: cred.user.email,
        displayName: cred.user.displayName || email.split('@')[0]
      }));
      successMsg.textContent = 'Berjaya! Mengalihkan...';
      successMsg.style.display = 'block';
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    } catch (err) {
      let msg = 'Ralat semasa log masuk. Cuba lagi.';
      if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
        msg = 'Emel atau kata laluan tidak betul.';
      } else if (err.code === 'auth/too-many-requests') {
        msg = 'Terlalu banyak percubaan. Cuba lagi sebentar.';
      } else if (err.code === 'auth/invalid-email') {
        msg = 'Format emel tidak sah.';
      }
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Log Masuk';
    }
  };
</script>
</body>
</html>
