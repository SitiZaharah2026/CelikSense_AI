<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Kata Laluan – CelikSense AI</title>
<link rel="stylesheet" href="styles.css">
<style>
body { background: linear-gradient(160deg,#c4b8ff 0%,#ddd6ff 40%,#7dd3ea 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; }
.auth-card { background:#fff; border-radius:24px; padding:40px 36px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(99,102,241,0.18); }
.auth-logo { text-align:center; margin-bottom:28px; }
.auth-logo .logo-icon { font-size:48px; line-height:1; }
.auth-logo h1 { font-size:22px; font-weight:900; color:#1e1b4b; margin:8px 0 2px; }
.auth-logo p { font-size:13px; color:#64748b; }
.form-group { margin-bottom:18px; }
.form-group label { display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:6px; }
.form-group input { width:100%; padding:12px 14px; border:1.5px solid #e2e8f0; border-radius:12px; font-size:15px; outline:none; transition:border-color 0.2s; box-sizing:border-box; }
.form-group input:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,0.12); }
.btn-primary { width:100%; padding:14px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; transition:opacity 0.2s; }
.btn-primary:hover { opacity:0.9; }
.btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
.auth-links { text-align:center; margin-top:20px; font-size:13px; color:#64748b; }
.auth-links a { color:#6366f1; font-weight:600; text-decoration:none; }
.auth-links a:hover { text-decoration:underline; }
.divider { border:none; border-top:1px solid #f1f5f9; margin:20px 0; }
.error-msg { background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:10px 14px; font-size:13px; color:#dc2626; margin-bottom:16px; display:none; }
.success-msg { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:12px 14px; font-size:13px; color:#16a34a; margin-bottom:16px; display:none; }
.info-box { background:#eff6ff; border:1px solid #bfdbfe; border-radius:12px; padding:14px; font-size:13px; color:#1e40af; margin-bottom:20px; line-height:1.5; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-icon">🔑</div>
    <h1>Lupa Kata Laluan?</h1>
    <p>Kami akan hantar pautan reset ke emel anda</p>
  </div>

  <div class="info-box">
    💡 Masukkan emel yang anda gunakan semasa mendaftar. Kami akan hantar pautan untuk menetapkan semula kata laluan anda.
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <form id="resetForm" onsubmit="handleReset(event)">
    <div class="form-group">
      <label for="email">Emel</label>
      <input type="email" id="email" placeholder="nama@emel.com" required autocomplete="email">
    </div>
    <button type="submit" class="btn-primary" id="submitBtn">Hantar Pautan Reset</button>
  </form>

  <hr class="divider">
  <div class="auth-links">
    <a href="signin.html">← Kembali ke Log Masuk</a>
  </div>
  <div class="auth-links" style="margin-top:10px;">
    Belum ada akaun? <a href="signup.html">Daftar sekarang</a>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA3yXQ06-FtBXIJ6oMFDDUjP6Z6-qeEKEU",
    authDomain: "prestij-zaharah-celiksense.firebaseapp.com",
    projectId: "prestij-zaharah-celiksense",
    storageBucket: "prestij-zaharah-celiksense.firebasestorage.app",
    messagingSenderId: "116242246073",
    appId: "1:116242246073:web:e40d0d20f4c6b733b0ae68",
    measurementId: "G-V54MJ8HBVJ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.handleReset = async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Menghantar...';

    try {
      await sendPasswordResetEmail(auth, email);
      successMsg.innerHTML = `✅ Emel reset telah dihantar ke <strong>${email}</strong>.<br>Sila semak peti masuk (dan folder spam) anda.`;
      successMsg.style.display = 'block';
      document.getElementById('resetForm').style.display = 'none';
    } catch (err) {
      let msg = 'Ralat. Cuba lagi.';
      if (err.code === 'auth/user-not-found') {
        msg = 'Tiada akaun dengan emel ini. Sila daftar dahulu.';
      } else if (err.code === 'auth/invalid-email') {
        msg = 'Format emel tidak sah.';
      } else if (err.code === 'auth/too-many-requests') {
        msg = 'Terlalu banyak permintaan. Cuba lagi sebentar.';
      }
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Hantar Pautan Reset';
    }
  };
</script>
</body>
</html>
